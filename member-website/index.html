<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login</title>

    <!-- SMART GYM Favicon -->
    <link rel="icon" type="image/png" href="assets/smart-gym-favicon.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="gym-title">

    <img
        src="assets/logo.png"
        alt="SMART GYM Logo"
        class="gym-logo"
    >

    <h2>SMART GYM</h2>

    <p>Member Portal</p>

</div>

        <div class="login-card">


            <h1>Member Login</h1>

           <p class="subtitle">
    Sign in with your registered WhatsApp number.
</p>

<div class="gym-selection">
    <label for="gymSearch">Choose Your Gym</label>
    <div class="gym-autocomplete">
        <input type="search" id="gymSearch" placeholder="Search your gym name..." autocomplete="off" aria-autocomplete="list" aria-controls="gymSuggestions">
        <div id="gymSuggestions" class="gym-suggestions" role="listbox" hidden></div>
    </div>
    <button type="button" id="confirmGymButton" disabled>Confirm Gym</button>
</div>

<form id="loginForm" style="display: none;">

    <label for="phone">
        Registered Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        placeholder="e.g. 60123456789"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p id="message" role="status" aria-live="polite"></p>

            <div class="register-section">

                <p>New member?</p>

                <a href="register.html">
                    Register Here
                </a>

            </div>

        </div>

    </div>

<script src="js/config.js"></script>
<script src="js/login.js?v=gym-select-3"></script>

</body>
</html>
