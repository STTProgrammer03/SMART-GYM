<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="gym-title">

    <img
        src="assets/logo.png"
        alt="U FITNESS GYM Logo"
        class="gym-logo"
    >

    <h2>U FITNESS GYM</h2>

    <p>Member Portal</p>

</div>

        <div class="login-card">


            <h1>Member Login</h1>

           <p class="subtitle">
    Sign in with your registered WhatsApp number.
</p>

<div class="gym-selection">
    <label for="workspace">
        Choose Your Gym
    </label>

    <select id="workspace" required>
        <option value="">Loading gyms...</option>
    </select>
</div>

<form id="loginForm" style="display: none;">

    <label for="phone">
        Registered Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        placeholder="e.g. 60123456789"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p id="message" role="status" aria-live="polite"></p>

            <div class="register-section">

                <p>New member?</p>

                <a href="register.html">
                    Register Here
                </a>

            </div>

        </div>

    </div>

<script src="js/config.js"></script>
<script src="js/login.js?v=otp-login-1"></script>

</body>
</html>
