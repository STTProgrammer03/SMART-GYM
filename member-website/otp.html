<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp OTP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>WhatsApp OTP</h1>

            <p class="subtitle">
                Enter the 6-digit OTP sent to your WhatsApp number.
            </p>

            <form id="otpForm">

                <label for="otp">OTP Code</label>

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    pattern="[0-9]{6}"
                    required
                >

                <button type="submit">
                    Verify OTP
                </button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <p class="resend">
                Didn't receive the code?
                <button type="button" id="resendButton">
                    Resend OTP
                </button>
            </p>

        </div>

    </div>

    <script src="js/otp.js?v=login-1"></script>

</body>
</html>
